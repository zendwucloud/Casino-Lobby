<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino God Mode (Admin)</title>
    <style>
        body { background-color: #1a1c29; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffd700; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .live-badge { background: #ff0000; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* 廣播區 */
        .broadcast-box { background: rgba(0,0,0,0.3); border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; }
        .broadcast-input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; }
        .btn-broadcast { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        .player-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .player-card:hover { border-color: #ffd700; background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .p-info h2 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .p-info .uid { color: #888; font-size: 0.8rem; font-family: monospace; }
        .p-info .vip { display: inline-block; background: #333; color: #ffd700; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-top: 5px; border: 1px solid #555; }
        .p-balance { text-align: right; margin-right: 20px; }
        .balance-num { font-size: 1.5rem; font-weight: bold; color: #00ff00; }
        .balance-label { font-size: 0.8rem; color: #aaa; }
        .actions { display: flex; gap: 10px; }
        input.amount-input { background: #333; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 5px; width: 100px; text-align: center; }
        button { cursor: pointer; padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #28a745; color: white; }
        .btn-set { background: #ffc107; color: #000; }
        #status-msg { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 5px; background: #333; color: #fff; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div id="status-msg">操作成功</div>
    <div class="container">
        <div class="header">
            <h1>⚡ Casino Admin (God Mode)</h1>
            <div class="live-badge">● LIVE DATABASE</div>
        </div>

        <div class="broadcast-box">
            <input type="text" id="ticker-input" class="broadcast-input" placeholder="輸入跑馬燈文字... (例如: 恭喜 ZEND 贏得 1000 萬大獎!)">
            <button class="btn-broadcast" onclick="sendBroadcast()">📢 發送全頻廣播</button>
        </div>

<div class="broadcast-box" style="margin-top: 20px; flex-direction: column; gap: 15px;">
            <h3 style="margin: 0; color: #ffd700; border-bottom: 1px solid #555; padding-bottom: 10px;">🎮 遊戲連結管理</h3>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="number" id="game-id-input" class="amount-input" placeholder="遊戲編號 (1~99)" min="1" max="99" style="width: 150px;">
                <input type="text" id="game-name-input" class="broadcast-input" placeholder="遊戲名稱 (例: 火龍秘寶)" style="flex: 1;">
                <input type="text" id="game-url-input" class="broadcast-input" placeholder="遊戲網址 (https://...)" style="flex: 2;">
                <button class="btn-add" onclick="saveGameConfig()">💾 儲存設定</button>
            </div>
            <div id="game-config-list" style="font-size: 0.9rem; color: #aaa; margin-top: 10px; line-height: 1.8;">
                載入設定中...
            </div>
        </div>

        <div id="player-list">
            <div style="text-align:center; color:#888; margin-top:50px;">連線中...</div>
        </div>
    </div>



    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA13JH6n_YRY2Rtiuq2u3iN4mEe5cQL8Bo",
            authDomain: "casino-lobby-123f5.firebaseapp.com",
            projectId: "casino-lobby-123f5",
            storageBucket: "casino-lobby-123f5.firebasestorage.app",
            messagingSenderId: "433397567788",
            appId: "1:433397567788:web:197a552bba01b186dedc89"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

// --- ★★★ 加入這段讓 Admin 取得權限 ★★★ ---
firebase.auth().signInAnonymously()
    .then(() => {
        console.log("Admin 介面已取得連線權限");
        // 如果原本有連線成功的提示函式，可以在這裡呼叫，例如: updateStatus("已連線");
    })
    .catch((error) => {
        console.error("Admin 連線失敗:", error);
        alert("權限不足，無法連線資料庫");
    });
// ------------------------------------------


        db.ref('players').on('value', (snapshot) => {
            const listDiv = document.getElementById('player-list');
            listDiv.innerHTML = '';
            const data = snapshot.val();
            if (!data) { listDiv.innerHTML = '<div style="text-align:center; padding:20px;">目前沒有玩家</div>'; return; }
            Object.entries(data).forEach(([uid, player]) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="p-info"><h2>${player.name || 'Unknown'}</h2><div class="uid">${uid}</div><div class="vip">VIP.${player.vip || 1}</div></div>
                    <div class="p-balance"><div class="balance-num">${(player.balance || 0).toLocaleString()}</div><div class="balance-label">CREDITS</div></div>
                    <div class="actions">
                        <input type="number" id="input-${uid}" class="amount-input" placeholder="金額" step="1000">
                        <button class="btn-add" onclick="modifyBalance('${uid}', 'add')">+ 加值</button>
                        <button class="btn-set" onclick="modifyBalance('${uid}', 'set')">= 設定</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        });

        window.modifyBalance = function(uid, mode) {
            const input = document.getElementById(`input-${uid}`);
            const amount = parseFloat(input.value);
            if (isNaN(amount)) { alert("請輸入有效的數字！"); return; }
            const userRef = db.ref('players/' + uid + '/balance');
            if (mode === 'add') {
                userRef.transaction((current) => (current || 0) + amount, (e,c) => { if(c) showToast(`已增加 ${amount}`); });
            } else if (mode === 'set') {
                userRef.set(amount, (e) => { if(!e) showToast(`已設定為 ${amount}`); });
            }
            input.value = '';
        };

        window.sendBroadcast = function() {
            const msg = document.getElementById('ticker-input').value;
            if(!msg) return;
            // 寫入 Firebase 的 system/ticker 路徑
            db.ref('system/ticker').set(msg);
            showToast("跑馬燈已發送！");
            // 3秒後清空，避免新玩家進來一直看到舊訊息
            setTimeout(() => { db.ref('system/ticker').set(null); }, 3000); 
        };

        function showToast(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2000);
        }

// --- ★ 遊戲連結管理邏輯 ★ ---
        // 監聽並顯示目前的遊戲設定
        db.ref('system/games').on('value', (snapshot) => {
            const listDiv = document.getElementById('game-config-list');
            const data = snapshot.val();
            if (!data) {
                listDiv.innerHTML = "目前尚無配置任何遊戲連結。";
                return;
            }
            let html = "";
            Object.entries(data).forEach(([id, game]) => {
                html += `<div><strong style="color:#fff;">[${id}] ${game.name}</strong> : <a href="${game.url}" target="_blank" style="color:#007bff;">${game.url}</a> <button onclick="deleteGameConfig(${id})" style="padding:2px 5px; font-size:0.7rem; background:#dc3545; border:none; color:white; border-radius:3px; cursor:pointer; margin-left:10px;">刪除</button></div>`;
            });
            listDiv.innerHTML = html;
        });

        // 儲存遊戲設定
        window.saveGameConfig = function() {
            const id = document.getElementById('game-id-input').value;
            const name = document.getElementById('game-name-input').value;
            const url = document.getElementById('game-url-input').value;

            if (!id || !name || !url) { alert("請填寫完整資訊！"); return; }
            
            db.ref('system/games/' + id).set({
                name: name,
                url: url,
                active: true
            }).then(() => {
                showToast(`遊戲 [${id}] 設定已儲存！`);
                document.getElementById('game-id-input').value = '';
                document.getElementById('game-name-input').value = '';
                document.getElementById('game-url-input').value = '';
            });
        };

        // 刪除遊戲設定
        window.deleteGameConfig = function(id) {
            if (confirm(`確定要刪除遊戲 [${id}] 的連結設定嗎？`)) {
                db.ref('system/games/' + id).remove().then(() => showToast(`已刪除遊戲 [${id}] 設定`));
            }
        };

    </script>
</body>
</html>
