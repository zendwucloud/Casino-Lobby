<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino God Mode (Admin)</title>
    <style>
        body { background-color: #1a1c29; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffd700; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { margin: 0; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .live-badge { background: #ff0000; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* 區塊樣式 */
        .broadcast-box { background: rgba(0,0,0,0.3); border: 1px solid #444; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 10px; }
        .broadcast-input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #555; background: #222; color: #fff; }
        .btn-broadcast { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        .btn-broadcast:active { transform: scale(0.95); }

        .player-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; }
        .player-card:hover { border-color: #ffd700; background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .p-info h2 { margin: 0 0 5px 0; font-size: 1.2rem; }
        .p-info .uid { color: #888; font-size: 0.8rem; font-family: monospace; }
        .p-info .vip { display: inline-block; background: #333; color: #ffd700; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-top: 5px; border: 1px solid #555; }
        .p-balance { text-align: right; margin-right: 20px; }
        .balance-num { font-size: 1.5rem; font-weight: bold; color: #00ff00; }
        .balance-label { font-size: 0.8rem; color: #aaa; }
        .actions { display: flex; gap: 10px; }
        input.amount-input { background: #333; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 5px; width: 100px; text-align: center; }
        button { cursor: pointer; padding: 8px 15px; border-radius: 5px; border: none; font-weight: bold; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #28a745; color: white; }
        .btn-set { background: #ffc107; color: #000; }
        #status-msg { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 5px; background: #333; color: #fff; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div id="status-msg">操作成功</div>
    <div class="container">
        <div class="header">
            <h1>⚡ Casino Admin (God Mode)</h1>
            <div class="live-badge">● LIVE DATABASE</div>
        </div>

        <div class="broadcast-box">
            <input type="text" id="ticker-input" class="broadcast-input" placeholder="輸入跑馬燈文字... (例如: 恭喜 ZEND 贏得 1000 萬大獎!)">
            <button class="btn-broadcast" onclick="sendBroadcast()">📢 發送全頻廣播</button>
        </div>

        <div class="broadcast-box" style="flex-direction: column; gap: 15px; border-color: #00bfff;">
            <h3 style="margin: 0; color: #00bfff; text-shadow: 0 0 5px rgba(0,191,255,0.5);">⚙️ 系統參數設定</h3>
            <div style="display: flex; gap: 20px; align-items: flex-end;">
                <div>
                    <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">訪客初始金額 (Guest)</div>
                    <input type="number" id="setting-guest-balance" class="amount-input" style="width: 150px;">
                </div>
                <div>
                    <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">註冊初始金額 (Register)</div>
                    <input type="number" id="setting-reg-balance" class="amount-input" style="width: 150px;">
                </div>
                <button class="btn-broadcast" onclick="saveSystemSettings()" style="background: #8a2be2;">💾 儲存設定</button>
            </div>
        </div>

        <div class="broadcast-box" style="flex-direction: column; gap: 15px; border-color: #f4d06f;">
            <h3 style="margin: 0; color: #f4d06f; text-shadow: 0 0 5px rgba(244,208,111,0.5);">🎮 遊戲連結管理</h3>
            <div style="display: flex; gap: 10px; align-items: flex-end;">
                <div>
                    <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">遊戲 ID (如: slot1)</div>
                    <input type="text" id="game-id-input" class="broadcast-input" style="width: 100px;">
                </div>
                <div>
                    <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">遊戲名稱</div>
                    <input type="text" id="game-name-input" class="broadcast-input" style="width: 150px;">
                </div>
                <div style="flex: 1;">
                    <div style="color: #aaa; font-size: 0.8rem; margin-bottom: 5px;">遊戲網址 (URL)</div>
                    <input type="text" id="game-url-input" class="broadcast-input" style="width: 100%;">
                </div>
                <button class="btn-broadcast" onclick="saveGameConfig()" style="background: #28a745;">💾 儲存/新增</button>
            </div>
            <div id="game-list-content" style="background: rgba(0,0,0,0.5); border-radius: 5px; max-height: 200px; overflow-y: auto;">
                <div style="text-align:center; color:#888; padding: 10px;">載入中...</div>
            </div>
        </div>

        <div id="player-list">
            <div style="text-align:center; color:#888; margin-top:50px;">連線中...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA13JH6n_YRY2Rtiuq2u3iN4mEe5cQL8Bo",
            authDomain: "casino-lobby-123f5.firebaseapp.com",
            projectId: "casino-lobby-123f5",
            storageBucket: "casino-lobby-123f5.firebasestorage.app",
            messagingSenderId: "433397567788",
            appId: "1:433397567788:web:197a552bba01b186dedc89"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Admin 權限連線
        firebase.auth().signInAnonymously().catch((error) => {
            console.error("Admin 連線失敗:", error);
            alert("權限不足，無法連線資料庫");
        });

        // --- 1. 玩家列表與餘額管理 ---
        db.ref('players').on('value', (snapshot) => {
            const listDiv = document.getElementById('player-list');
            listDiv.innerHTML = '';
            const data = snapshot.val();
            if (!data) { listDiv.innerHTML = '<div style="text-align:center; padding:20px;">目前沒有玩家</div>'; return; }
            Object.entries(data).forEach(([uid, player]) => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="p-info"><h2>${player.name || 'Unknown'}</h2><div class="uid">${uid}</div><div class="vip">VIP.${player.vip || 1}</div></div>
                    <div class="p-balance"><div class="balance-num">${(player.balance || 0).toLocaleString()}</div><div class="balance-label">CREDITS</div></div>
                    <div class="actions">
                        <input type="number" id="input-${uid}" class="amount-input" placeholder="金額" step="1000">
                        <button class="btn-add" onclick="modifyBalance('${uid}', 'add')">+ 加值</button>
                        <button class="btn-set" onclick="modifyBalance('${uid}', 'set')">= 設定</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        });

        window.modifyBalance = function(uid, mode) {
            const input = document.getElementById(`input-${uid}`);
            const amount = parseFloat(input.value);
            if (isNaN(amount)) { alert("請輸入有效的數字！"); return; }
            const userRef = db.ref('players/' + uid + '/balance');
            if (mode === 'add') {
                userRef.transaction((current) => (current || 0) + amount, (e,c) => { if(c) showToast(`已增加 ${amount}`); });
            } else if (mode === 'set') {
                userRef.set(amount, (e) => { if(!e) showToast(`已設定為 ${amount}`); });
            }
            input.value = '';
        };

        // --- 2. 廣播系統 ---
        window.sendBroadcast = function() {
            const msg = document.getElementById('ticker-input').value;
            if(!msg) return;
            db.ref('system/ticker').set(msg);
            showToast("跑馬燈已發送！");
            setTimeout(() => { db.ref('system/ticker').set(null); }, 3000); 
        };

        // --- 3. 系統參數設定 ---
        db.ref('system/settings').on('value', (snapshot) => {
            const settings = snapshot.val() || {};
            document.getElementById('setting-guest-balance').value = settings.guestInitialBalance !== undefined ? settings.guestInitialBalance : 10000;
            document.getElementById('setting-reg-balance').value = settings.registerInitialBalance !== undefined ? settings.registerInitialBalance : 100000;
        });

        window.saveSystemSettings = function() {
            const guestBal = parseFloat(document.getElementById('setting-guest-balance').value) || 0;
            const regBal = parseFloat(document.getElementById('setting-reg-balance').value) || 0;
            
            db.ref('system/settings').update({
                guestInitialBalance: guestBal,
                registerInitialBalance: regBal
            }).then(() => {
                showToast("系統參數已成功更新！");
            }).catch((error) => {
                alert("儲存失敗: " + error.message);
            });
        };

        // --- 4. 遊戲連結管理 ---
        db.ref('system/games').on('value', (snapshot) => {
            const listDiv = document.getElementById('game-list-content');
            const games = snapshot.val();
            if(!games) { listDiv.innerHTML = '<div style="padding:10px; color:#888; text-align:center;">目前沒有遊戲設定</div>'; return; }
            
            let html = '';
            Object.entries(games).forEach(([id, game]) => {
                html += `<div style="padding:10px; border-bottom:1px solid #555; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong style="color:#f4d06f;">[${id}] ${game.name}</strong><br>
                                <a href="${game.url}" target="_blank" style="color:#007bff; font-size: 0.8rem;">${game.url}</a>
                            </div>
                            <button onclick="deleteGameConfig('${id}')" style="padding:5px 10px; font-size:0.8rem; background:#dc3545; border:none; color:white; border-radius:3px; cursor:pointer;">刪除</button>
                         </div>`;
            });
            listDiv.innerHTML = html;
        });

        window.saveGameConfig = function() {
            const id = document.getElementById('game-id-input').value.trim();
            const name = document.getElementById('game-name-input').value.trim();
            const url = document.getElementById('game-url-input').value.trim();

            if (!id || !name || !url) { alert("請填寫完整資訊！"); return; }
            
            db.ref('system/games/' + id).update({
                name: name,
                url: url,
                active: true
            }).then(() => {
                showToast(`遊戲 [${id}] 設定已儲存！`);
                document.getElementById('game-id-input').value = '';
                document.getElementById('game-name-input').value = '';
                document.getElementById('game-url-input').value = '';
            });
        };

        window.deleteGameConfig = function(id) {
            if(confirm(`確定要刪除遊戲 [${id}] 嗎？`)) {
                db.ref('system/games/' + id).remove().then(() => {
                    showToast(`遊戲 [${id}] 已刪除`);
                });
            }
        };

        // UI 提示小工具
        function showToast(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg; el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 2000);
        }
    </script>
</body>
</html>
